name: Gerar APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Montar projeto Android
        run: |
          mkdir -p apk/www && cp game.html apk/www/index.html
          cd apk && npm install && npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $M
          npx cap sync android
      - name: Compilar
        run: cd apk/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: zombizes-apk, path: apk/android/app/build/outputs/apk/debug/app-debug.apk }
